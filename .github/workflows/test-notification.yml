name: Monitor CP

on:
  workflow_dispatch:
    inputs:
      teste:
        description: "Modo de teste (ignora janelas e fim de semana e avisa de todos os comboios)"
        type: boolean
        default: false
  schedule:
    - cron: "7,17,27,37,47,57 4-6 * * 1-5"    # manhã (Braga)
    - cron: "7,17,27,37,47,57 15-18 * * 1-5"  # tarde (São Frutuoso)  # tarde (Porto > Braga)

concurrency:
  group: monitor-cp
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Restaurar estado dos alertas
        uses: actions/cache@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Executar monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CP_API_KEY: ${{ secrets.CP_API_KEY }}
          CP_CONNECT_ID: ${{ secrets.CP_CONNECT_ID }}
          CP_CONNECT_SECRET: ${{ secrets.CP_CONNECT_SECRET }}
          TESTE: ${{ inputs.teste && '1' || '' }}
        run: python src/monitor.py
